<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>CodeAlpha Store</h2>
        <a href="index.html">Back to Home</a>
    </header>
    <div class="container">
        <div class="product-card" style="max-width: 400px; margin: 20px auto;">
            <h2 id="p-name"></h2>
            <p id="p-desc"></p>
            <h3>Price: ₹<span id="p-price"></span></h3>
            <button onclick="addToCartFromDetail()">Add to Cart</button>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        let currentProduct = null;

        fetch(`/api/products/${productId}`)
            .then(res => res.json())
            .then(data => {
                currentProduct = data;
                document.getElementById('p-name').innerText = data.name;
                document.getElementById('p-desc').innerText = data.description;
                document.getElementById('p-price').innerText = data.price;
            });

        function addToCartFromDetail() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push(currentProduct);
            localStorage.setItem('cart', JSON.stringify(cart));
            alert('Product added to cart!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
